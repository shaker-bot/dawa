[project]
name = "claudeopt"
version = "0.1.0"
description = "Claude Code settings optimizer for token efficiency"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89.0",
    "rich>=15.0.0",
]

[project.scripts]
claudeopt = "claudeopt.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeopt"]
